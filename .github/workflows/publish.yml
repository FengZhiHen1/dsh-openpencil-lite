name: Publish npm package

# Triggered on a v* tag push — builds the op-web-sdk wasm pkg inside the
# vendored OpenPencil submodule (see check.yml), syncs the viewer assets,
# builds the plugin, verifies the package.json version against the tag, and
# publishes @zseven-w/dsh-openpencil to the public npm registry.
#
# Requires the repository secret:
#   NPM_TOKEN   npm registry automation token for publishing (public registry)
#
# Prerelease versions (0.x.0-rc.*) publish under the `next` dist-tag, so
# the `latest` tag is never silently moved by an rc release.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    name: Build and publish @zseven-w/dsh-openpencil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94'
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen-cli (pinned to the locked version)
        run: |
          cd vendor/openpencil
          version="$(awk '/^name = "wasm-bindgen"$/{found=1; next} found && /^version = /{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.lock)"
          if [ -z "$version" ]; then
            echo "::error::could not resolve wasm-bindgen version from Cargo.lock"
            exit 1
          fi
          echo "Installing wasm-bindgen-cli $version"
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build op-web-sdk wasm pkg
        run: |
          cd vendor/openpencil
          cargo build -p op-web-sdk --target wasm32-unknown-unknown --features canvaskit --release
          wasm-bindgen --target web --out-dir crates/op-web-sdk/pkg target/wasm32-unknown-unknown/release/op_web_sdk.wasm
      - name: Sync viewer assets
        run: pnpm run sync:viewer-assets
      - name: Build
        run: pnpm run build
      - name: Verify package version matches tag
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::package.json version $VERSION does not match tag $TAG"
            exit 1
          fi
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          npm whoami
      - name: Publish npm package
        run: pnpm publish --access public --tag next
