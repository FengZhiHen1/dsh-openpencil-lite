name: Plugin check

# Runs the full TypeScript build and test suite for the DSH OpenPencil
# plugin on every PR and push to main. No path filters: the repo is small
# and every change (sources, scripts, or viewer assets) feeds the build.
#
# The viewer-asset sync needs an OpenPencil checkout as a sibling
# (packages/op-web-sdk sources + crates/op-host-web CanvasKit assets), so
# the job clones ZSeven-W/openpencil next to the workspace first. The DSH
# host/client packages are peer dependencies resolved from the public npm
# registry by `npm ci`.

on:
  pull_request:
  push:
    branches: ['main']

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node 24 / ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Clone OpenPencil checkout (viewer asset source)
        run: git clone --depth 1 https://github.com/ZSeven-W/openpencil.git ../openpencil
      - name: Sync viewer assets
        run: npm run sync:viewer-assets
      - name: Build
        run: npm run build
      - name: Test viewer assets
        run: npm run test:viewer-assets
      - name: Test client
        run: npm run test:client
      - name: Test host API
        run: npm run test:host-api
      - name: Test MCP client
        run: npm run test:mcp
